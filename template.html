<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drift Fund Live Screener</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0d12; color: #d1d5db; }
  .header { background: #14161f; padding: 14px 20px; border-bottom: 1px solid #262a3a; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; position: sticky; top: 0; z-index: 30; }
  .header h1 { font-size: 18px; color: #fff; white-space: nowrap; display: flex; align-items: center; gap: 10px; }
  .badge { font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 4px; letter-spacing: .4px; }
  .badge.live { background: #052e1a; color: #22c55e; border: 1px solid #14532d; }
  .badge.connecting { background: #2e1f05; color: #f59e0b; border: 1px solid #78350f; }
  .badge.offline { background: #2e0505; color: #ef4444; border: 1px solid #7f1d1d; }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; flex: 1; }
  .search-box { background: #1e2230; border: 1px solid #333850; border-radius: 6px; padding: 7px 11px; color: #fff; font-size: 13px; width: 200px; outline: none; }
  .search-box:focus { border-color: #6366f1; }
  .search-box::placeholder { color: #6b7280; }
  .chip { background: #1e2230; border: 1px solid #333850; border-radius: 6px; padding: 6px 11px; color: #9ca3af; font-size: 12px; cursor: pointer; }
  .chip:hover { background: #2a2f42; color: #fff; }
  .chip.active { background: #6366f1; border-color: #6366f1; color: #fff; }
  .tf-group { display: flex; gap: 3px; background: #12141c; padding: 3px; border-radius: 7px; border: 1px solid #262a3a; }
  .tf-btn { background: none; border: none; border-radius: 5px; padding: 5px 9px; font-size: 11px; font-weight: 600; color: #9ca3af; cursor: pointer; }
  .tf-btn:hover { color: #fff; }
  .tf-btn.active { background: #6366f1; color: #fff; }
  .stats { padding: 7px 20px; background: #0f1117; border-bottom: 1px solid #262a3a; font-size: 12px; color: #6b7280; display: flex; gap: 18px; align-items: center; position: sticky; top: 57px; z-index: 20; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  thead { position: sticky; top: 88px; z-index: 10; }
  th { background: #14161f; padding: 9px 10px; text-align: right; font-weight: 600; color: #9ca3af; border-bottom: 1px solid #262a3a; cursor: pointer; white-space: nowrap; user-select: none; }
  th:first-child { text-align: left; }
  th:hover { color: #fff; }
  th.tf-col { border-left: 1px solid #1c1f2b; }
  th.active-tf { background: #1b1e30; color: #c7d2fe; }
  th .arr { font-size: 9px; margin-left: 3px; }
  td { padding: 8px 10px; text-align: right; border-bottom: 1px solid #171a24; white-space: nowrap; font-variant-numeric: tabular-nums; }
  td:first-child { text-align: left; }
  td.tf-col { border-left: 1px solid #14161f; }
  tr:hover td { background: #14161f; }
  .coin-cell { display: flex; align-items: center; gap: 7px; }
  .coin-icon { width: 18px; height: 18px; border-radius: 50%; background: #262a3a; }
  .coin-symbol { font-weight: 700; color: #fff; }
  .coin-name { color: #6b7280; font-size: 11px; }
  .src-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-left: 4px; }
  .src-dot.binance { background: #22c55e; }
  .src-dot.coingecko { background: #f59e0b; }
  .positive { color: #22c55e; }
  .negative { color: #ef4444; }
  .neutral { color: #4b5563; }
  .strong-pos { color: #16a34a; background: rgba(34,197,94,.10); border-radius: 3px; }
  .strong-neg { color: #dc2626; background: rgba(239,68,68,.10); border-radius: 3px; }
  #no-results { text-align: center; padding: 40px; color: #6b7280; display: none; }
  .loading { text-align: center; padding: 60px; color: #9ca3af; font-size: 15px; }
  .spinner { display: inline-block; width: 22px; height: 22px; border: 3px solid #333850; border-top-color: #6366f1; border-radius: 50%; animation: spin .8s linear infinite; margin-right: 10px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <h1>Drift Fund <span style="color:#6366f1">Live</span> Screener
    <span class="badge connecting" id="status">CONNECTING</span>
  </h1>
  <div class="controls">
    <input type="text" class="search-box" id="search" placeholder="Search symbol / name...">
    <div class="tf-group" id="tf-btns">
      <button class="tf-btn" data-tf="m1">1M</button>
      <button class="tf-btn" data-tf="m5">5M</button>
      <button class="tf-btn" data-tf="m15">15M</button>
      <button class="tf-btn" data-tf="m30">30M</button>
      <button class="tf-btn" data-tf="h1">1H</button>
      <button class="tf-btn" data-tf="h4">4H</button>
      <button class="tf-btn active" data-tf="h24">24H</button>
    </div>
    <button class="chip" id="filter-gainers">Gainers</button>
    <button class="chip" id="filter-losers">Losers</button>
    <button class="chip" id="filter-all" style="display:none">Show All</button>
  </div>
</div>

<div class="stats" id="stats"><span class="spinner"></span> Loading live market data...</div>

<div class="table-wrap">
<table id="table" style="display:none">
<thead>
<tr id="thead-row"></tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>
<div id="no-results">No coins match your filter.</div>

<script>
// ===================== Symbol maps (generated) =====================
const BINANCE = __BINANCE_JSON__;      // Drift symbol -> Binance pair
const CG_ONLY = __CG_ONLY_JSON__;      // Drift symbol -> CoinGecko id (non-Binance)
const DF_TO_CG = __DF_TO_CG_JSON__;    // Drift symbol -> CoinGecko id (all, for name/mcap/icon)

const PAIR_TO_DF = {};
for (const [df, pair] of Object.entries(BINANCE)) PAIR_TO_DF[pair] = df;
const ID_TO_DF = {};
for (const [df, id] of Object.entries(DF_TO_CG)) if (!(id in ID_TO_DF)) ID_TO_DF[id] = df;

const ALL = [...Object.keys(BINANCE), ...Object.keys(CG_ONLY)];

// ===================== Timeframes =====================
const TIMEFRAMES = [
  ["m1","1M"], ["m5","5M"], ["m15","15M"], ["m30","30M"],
  ["h1","1H"], ["h4","4H"], ["h24","24H"]
];
const WINDOWS = { m1:"1m", m5:"5m", m15:"15m", m30:"30m", h1:"1h", h4:"4h" };

// ===================== State =====================
const state = {};   // df -> { price, vol24, mcap, name, image, chgCG:{h1,h24}, src }
for (const df of ALL) {
  state[df] = { price:null, vol24:null, mcap:null, name:df, image:"",
                chgCG:{h1:null,h24:null}, src: BINANCE[df] ? "binance" : "coingecko" };
}
const live = {};     // pair -> { c, o, q }
const anchors = {};  // df -> { m1,m5,m15,m30,h1,h4 }

let activeTF = "h24";
let sort = { col: "h24", asc: false };
let filterMode = "all";
let lastWs = 0;
let ready = false;

// ===================== Elements =====================
const $ = id => document.getElementById(id);
const tbody = $("tbody"), table = $("table"), theadRow = $("thead-row");
const searchInput = $("search"), statsEl = $("stats"), statusEl = $("status");
const noResults = $("no-results"), tfBtns = $("tf-btns");

// ===================== Helpers =====================
const sleep = ms => new Promise(r => setTimeout(r, ms));

function fmtUSD(v) {
  if (v == null || !isFinite(v)) return "—";
  const a = Math.abs(v);
  if (a >= 1e9) return "$" + (v/1e9).toFixed(2) + "B";
  if (a >= 1e6) return "$" + (v/1e6).toFixed(2) + "M";
  if (a >= 1e3) return "$" + (v/1e3).toFixed(1) + "K";
  if (a >= 1) return "$" + v.toFixed(2);
  if (a >= 0.001) return "$" + v.toFixed(4);
  if (a >= 0.0001) return "$" + v.toFixed(6);
  return "$" + v.toPrecision(4);
}

function fmtPct(v) {
  if (v == null || !isFinite(v)) return '<span class="neutral">—</span>';
  const cls = v > 0 ? "positive" : v < 0 ? "negative" : "neutral";
  const strong = Math.abs(v) >= 5 ? (v > 0 ? " strong-pos" : " strong-neg") : "";
  return `<span class="${cls}${strong}">${v > 0 ? "+" : ""}${v.toFixed(2)}%</span>`;
}

function setStatus(kind, text) {
  statusEl.className = "badge " + kind;
  statusEl.textContent = text;
}

// ===================== Compute rows =====================
function computeRows() {
  const now = Date.now();
  const out = [];
  for (const df of ALL) {
    const s = state[df];
    let row = { symbol: df, name: s.name, image: s.image, mcap: s.mcap,
                src: s.src, price: null, vol: null, chg: {} };

    if (s.src === "binance") {
      const L = live[BINANCE[df]];
      const a = anchors[df] || {};
      const price = L && L.c ? parseFloat(L.c) : s.price;
      row.price = price;
      row.vol = L && L.q ? parseFloat(L.q) : s.vol24;
      const base = price;
      for (const [key] of TIMEFRAMES) {
        if (key === "h24") {
          row.chg.h24 = (L && L.o && L.c) ? (parseFloat(L.c)/parseFloat(L.o) - 1) * 100
                                          : s.chgCG.h24;
        } else {
          const anchor = a[key];
          row.chg[key] = (anchor && base) ? (base/anchor - 1) * 100 : null;
        }
      }
    } else {
      row.price = s.price;
      row.vol = s.vol24;
      row.chg.h1 = s.chgCG.h1;
      row.chg.h24 = s.chgCG.h24;
    }
    out.push(row);
  }
  return out;
}

// ===================== Render =====================
function render() {
  const rows = computeRows();
  const q = searchInput.value.toLowerCase().trim();

  let filtered = rows.filter(r => {
    if (q && !r.symbol.toLowerCase().includes(q) && !(r.name||"").toLowerCase().includes(q)) return false;
    if (filterMode === "gainers") return ((r.chg[activeTF] == null ? -Infinity : r.chg[activeTF])) > 0;
    if (filterMode === "losers") return ((r.chg[activeTF] == null ? Infinity : r.chg[activeTF])) < 0;
    return true;
  });

  filtered.sort((a, b) => {
    let av, bv;
    if (sort.col === "symbol") { av = a.symbol; bv = b.symbol;
      return sort.asc ? av.localeCompare(bv) : bv.localeCompare(av); }
    if (sort.col === "price") { av = a.price; bv = b.price; }
    else if (sort.col === "vol") { av = a.vol; bv = b.vol; }
    else if (sort.col === "mcap") { av = a.mcap; bv = b.mcap; }
    else { av = a.chg[sort.col]; bv = b.chg[sort.col]; }
    av = (av == null || !isFinite(av)) ? -Infinity : av;
    bv = (bv == null || !isFinite(bv)) ? -Infinity : bv;
    return sort.asc ? av - bv : bv - av;
  });

  statsEl.innerHTML = `Showing <strong style="color:#e5e7eb">${filtered.length}</strong> / ${rows.length} coins`
    + ` &middot; <span style="color:#22c55e">●</span> Binance live`
    + ` &middot; <span style="color:#f59e0b">●</span> CoinGecko`
    + ` &middot; ${new Date().toLocaleTimeString()}`;

  if (!filtered.length) { tbody.innerHTML = ""; noResults.style.display = "block"; table.style.display = "none"; return; }
  noResults.style.display = "none"; table.style.display = "";

  tbody.innerHTML = filtered.map(r => {
    const icon = r.image ? `<img class="coin-icon" src="${r.image}" loading="lazy" alt="">` : `<span class="coin-icon"></span>`;
    const cells = TIMEFRAMES.map(([key]) => {
      const active = key === activeTF ? " active-tf" : "";
      return `<td class="tf-col${active}">${fmtPct(r.chg[key])}</td>`;
    }).join("");
    return `<tr>
      <td><div class="coin-cell">${icon}<div><span class="coin-symbol">${r.symbol}</span>
        <span class="src-dot ${r.src}" title="${r.src}"></span>
        <span class="coin-name">${r.name||""}</span></div></div></td>
      <td>${fmtUSD(r.price)}</td>
      ${cells}
      <td>${fmtUSD(r.vol)}</td>
      <td>${fmtUSD(r.mcap)}</td>
    </tr>`;
  }).join("");
}

// ===================== Table header =====================
function buildHeader() {
  const cols = [["symbol","#"],["price","Price"]]
    .concat(TIMEFRAMES.map(([k,l]) => [k,l]))
    .concat([["vol","Vol 24H"],["mcap","Mkt Cap"]]);
  theadRow.innerHTML = cols.map(([k,label]) => {
    const tf = TIMEFRAMES.some(([x]) => x === k) ? " tf-col" : "";
    const active = k === activeTF ? " active-tf" : "";
    return `<th class="${tf}${active}" data-col="${k}">${label}<span class="arr"></span></th>`;
  }).join("");
  theadRow.querySelectorAll("th").forEach(th => th.addEventListener("click", () => {
    const col = th.dataset.col;
    if (sort.col === col) sort.asc = !sort.asc; else sort = { col, asc: col === "symbol" };
    updateArrows(); render();
  }));
  updateArrows();
}
function updateArrows() {
  theadRow.querySelectorAll("th").forEach(th => {
    const a = th.querySelector(".arr");
    if (a) a.textContent = th.dataset.col === sort.col ? (sort.asc ? "▲" : "▼") : "";
  });
}

// ===================== Binance REST =====================
async function seed24h() {
  const pairs = Object.values(BINANCE);
  for (let i = 0; i < pairs.length; i += 150) {
    const batch = pairs.slice(i, i + 150);
    try {
      const r = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbols=${encodeURIComponent(JSON.stringify(batch))}`);
      if (!r.ok) continue;
      const d = await r.json();
      for (const t of d) {
        const L = live[t.symbol] || (live[t.symbol] = {});
        L.o = t.openPrice; L.q = t.quoteVolume;
        if (L.c == null) L.c = t.lastPrice;
      }
    } catch (e) {}
  }
}

async function seedWindows() {
  const pairs = Object.values(BINANCE);
  for (const [key, win] of Object.entries(WINDOWS)) {
    for (let i = 0; i < pairs.length; i += 100) {
      const batch = pairs.slice(i, i + 100);
      try {
        const r = await fetch(`https://api.binance.com/api/v3/ticker?symbols=${encodeURIComponent(JSON.stringify(batch))}&windowSize=${win}`);
        if (!r.ok) continue;
        const d = await r.json();
        for (const t of d) {
          const df = PAIR_TO_DF[t.symbol];
          if (!df) continue;
          (anchors[df] = anchors[df] || {})[key] = parseFloat(t.openPrice);
        }
      } catch (e) {}
      await sleep(120);
    }
  }
}

// ===================== CoinGecko REST =====================
async function cgMarkets(ids) {
  const out = [];
  for (let i = 0; i < ids.length; i += 150) {
    const batch = ids.slice(i, i + 150);
    try {
      const r = await fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${batch.join(",")}&per_page=250&sparkline=false&price_change_percentage=1h,24h`);
      if (!r.ok) continue;
      out.push(...await r.json());
    } catch (e) {}
    await sleep(300);
  }
  return out;
}

async function seedCGOnly() {
  const ids = Object.values(CG_ONLY);
  if (!ids.length) return;
  for (const c of await cgMarkets(ids)) {
    const df = ID_TO_DF[c.id];
    if (!df || !state[df]) continue;
    const s = state[df];
    s.price = c.current_price; s.vol24 = c.total_volume; s.mcap = c.market_cap;
    s.name = c.name; s.image = c.image || s.image;
    s.chgCG.h1 = c.price_change_percentage_1h_in_currency;
    s.chgCG.h24 = c.price_change_percentage_24h_in_currency;
  }
}

async function seedCGAll() {
  const ids = [...new Set(Object.values(DF_TO_CG))];
  for (const c of await cgMarkets(ids)) {
    const df = ID_TO_DF[c.id];
    if (!df || !state[df]) continue;
    const s = state[df];
    s.mcap = c.market_cap; s.name = c.name; s.image = c.image || s.image;
    if (s.src === "coingecko" && s.price == null) s.price = c.current_price;
  }
}

// ===================== WebSocket =====================
const WS_URLS = [
  "wss://stream.binance.com:9443/ws/!miniTicker@arr",
  "wss://data-stream.binance.vision/ws/!miniTicker@arr"
];
let ws, wsRetry = 0, wsIdx = 0;
function connectWS() {
  const url = WS_URLS[wsIdx % WS_URLS.length];
  try { ws = new WebSocket(url); }
  catch (e) { setStatus("offline", "OFFLINE"); setTimeout(connectWS, 5000); return; }
  ws.onopen = () => { wsRetry = 0; };
  ws.onmessage = ev => {
    lastWs = Date.now();
    if (ready) setStatus("live", "LIVE");
    let arr; try { arr = JSON.parse(ev.data); } catch (e) { return; }
    for (const d of arr) { const L = live[d.s] || (live[d.s] = {}); L.c = d.c; L.o = d.o; L.q = d.q; }
    scheduleRender();
  };
  ws.onclose = () => {
    setStatus("connecting", "RECONNECTING");
    wsRetry++; wsIdx++;
    setTimeout(connectWS, Math.min(1000 * wsRetry, 10000));
  };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
}

// ===================== Render loop =====================
let dirty = true;
const scheduleRender = () => { dirty = true; };
setInterval(() => { if (dirty && ready) { render(); dirty = false; } }, 1000);

// ===================== Events =====================
searchInput.addEventListener("input", () => render());
tfBtns.addEventListener("click", e => {
  const btn = e.target.closest(".tf-btn");
  if (!btn) return;
  tfBtns.querySelectorAll(".tf-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  activeTF = btn.dataset.tf;
  buildHeader(); render();
});
function setFilter(mode, btn) {
  filterMode = filterMode === mode ? "all" : mode;
  ["filter-gainers","filter-losers"].forEach(id => $(id).classList.remove("active"));
  if (filterMode !== "all") btn.classList.add("active");
  $("filter-all").style.display = filterMode === "all" ? "none" : "inline-block";
  render();
}
$("filter-gainers").addEventListener("click", function () { setFilter("gainers", this); });
$("filter-losers").addEventListener("click", function () { setFilter("losers", this); });
$("filter-all").addEventListener("click", function () {
  filterMode = "all";
  ["filter-gainers","filter-losers"].forEach(id => $(id).classList.remove("active"));
  this.style.display = "none"; render();
});

// ===================== Init =====================
async function init() {
  buildHeader();
  setStatus("connecting", "LOADING");
  await Promise.all([seed24h(), seedWindows(), seedCGAll(), seedCGOnly()]);
  ready = true;
  setStatus("connecting", "CONNECTING");
  connectWS();
  render();

  setInterval(seedWindows, 45000);   // small timeframe anchors
  setInterval(seed24h, 60000);       // 24h snapshot / fill gaps
  setInterval(seedCGOnly, 60000);    // non-Binance prices
  setInterval(seedCGAll, 300000);    // market caps / names / icons
  setInterval(() => {                // REST fallback if WS is down
    if (Date.now() - lastWs > 15000) seed24h();
  }, 5000);
}
init();
</script>
</body>
</html>
