<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drift Screener</title>
<style>
  :root {
    --bg: #131722;
    --panel: #1e222d;
    --panel-2: #171b26;
    --border: #2a2e39;
    --text: #d1d4dc;
    --muted: #787b86;
    --accent: #2962ff;
    --up: #26a69a;
    --down: #ef5350;
    --up-bg: rgba(38,166,154,.12);
    --down-bg: rgba(239,83,80,.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    color: var(--text);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(1200px 460px at 50% -12%, rgba(41,98,255,.16), transparent 62%),
      radial-gradient(760px 320px at 96% 4%, rgba(38,166,154,.09), transparent 60%),
      linear-gradient(rgba(255,255,255,.014) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.014) 1px, transparent 1px);
    background-size: auto, auto, 44px 44px, 44px 44px;
    background-attachment: fixed;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 32px; z-index: 40;
    display: flex; align-items: center; gap: 16px;
    height: 48px; padding: 0 16px;
    background: rgba(19,23,34,.82);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 15px; color: #fff; white-space: nowrap; text-shadow: 0 0 18px rgba(41,98,255,.35); }
  .logo {
    width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center;
    background: linear-gradient(135deg, #2962ff, #5b7cff); color: #fff; font-size: 13px; font-weight: 800;
    box-shadow: 0 2px 10px rgba(41,98,255,.45), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .status {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600; letter-spacing: .3px;
    padding: 3px 8px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted);
  }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .status.live { color: var(--up); border-color: rgba(38,166,154,.4); }
  .status.live .dot { background: var(--up); box-shadow: 0 0 8px var(--up); animation: pulse 2s infinite; }
  .status.connecting { color: #f0b90b; border-color: rgba(240,185,11,.4); }
  .status.connecting .dot { background: #f0b90b; }
  .status.offline { color: var(--down); border-color: rgba(239,83,80,.4); }
  .status.offline .dot { background: var(--down); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

  .search { position: relative; margin-left: 8px; }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); opacity: .5; }
  .search input {
    width: 260px; max-width: 40vw; height: 32px;
    padding: 0 12px 0 32px; border-radius: 6px;
    background: var(--panel); border: 1px solid var(--border);
    color: var(--text); font-size: 13px; outline: none;
  }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(41,98,255,.18); }
  .search input::placeholder { color: var(--muted); }
  .spacer { flex: 1; }
  .updated { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .updated b { color: var(--text); font-weight: 500; }

  /* ---------- Toolbar ---------- */
  .toolbar {
    position: sticky; top: 80px; z-index: 35;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 8px 16px; background: rgba(23,27,38,.88);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
  }
  .tfgroup { display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--border); border-radius: 7px; padding: 2px; }
  .tfbtn {
    border: 0; background: transparent; color: var(--muted);
    font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 5px; cursor: pointer;
  }
  .tfbtn:hover { color: var(--text); }
  .tfbtn.active { background: var(--accent); color: #fff; }

  .filters { display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--border); border-radius: 7px; padding: 2px; }
  .fbtn { border: 0; background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 5px; cursor: pointer; }
  .fbtn:hover { color: var(--text); }
  .fbtn.active { background: #2a2e39; color: #fff; }
  .fbtn.gain.active { background: var(--up-bg); color: var(--up); }
  .fbtn.lose.active { background: var(--down-bg); color: var(--down); }
  .fbtn.fave.active { background: rgba(240,185,11,.14); color: #f0b90b; box-shadow: inset 0 0 0 1px rgba(240,185,11,.35); }

  select {
    height: 30px; border-radius: 7px; background: var(--panel); border: 1px solid var(--border);
    color: var(--text); font-size: 12px; padding: 0 8px; outline: none; cursor: pointer;
  }

  /* ---------- Table ---------- */
  .wrap { padding: 0; }
  table { width: 100%; min-width: 620px; border-collapse: collapse; }
  thead th {
    position: sticky; top: 126px; z-index: 30;
    background: var(--panel-2); color: var(--muted);
    font-size: 11px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase;
    text-align: right; padding: 9px 16px; border-bottom: 1px solid var(--border);
    cursor: pointer; white-space: nowrap; user-select: none;
  }
  thead th:first-child { text-align: left; }
  thead th:hover { color: var(--text); }
  thead th .arr { color: var(--accent); margin-left: 4px; font-size: 9px; }
  thead th .tflabel { color: var(--accent); }

  tbody td {
    padding: 8px 16px; text-align: right; white-space: nowrap;
    border-bottom: 1px solid rgba(42,46,57,.5);
    font-variant-numeric: tabular-nums;
  }
  tbody td:first-child { text-align: left; }
  tbody tr { cursor: default; transition: background .15s; }
  tbody tr:hover td { background: var(--panel); }

  .sym { display: flex; align-items: center; gap: 9px; }
  .ico { width: 20px; height: 20px; border-radius: 50%; background: var(--panel); flex: none; }
  .sym .s { font-weight: 600; color: #fff; }
  .sym .n { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .src { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-left: 2px; flex: none; }
  .src.binance { background: var(--up); }
  .src.coingecko { background: #f0b90b; }
  .star {
    background: none; border: 0; padding: 0; cursor: pointer;
    font-size: 15px; line-height: 1; color: var(--muted);
    transition: color .15s, transform .15s; flex: none;
  }
  .star:hover { color: #f0b90b; transform: scale(1.2); }
  .star.on { color: #f0b90b; text-shadow: 0 0 8px rgba(240,185,11,.5); }

  .num { color: var(--text); }
  .dim { color: var(--muted); }
  .up { color: var(--up); font-weight: 500; }
  .down { color: var(--down); font-weight: 500; }
  .chg.big { padding: 2px 6px; border-radius: 4px; }
  .chg.up.big { background: var(--up-bg); }
  .chg.down.big { background: var(--down-bg); }

  .empty { text-align: center; color: var(--muted); padding: 48px 0; font-size: 14px; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #363a45; border-radius: 8px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #424651; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- Status bar ---------- */
  .statusbar {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 8px 16px; color: var(--muted); font-size: 12px;
    border-top: 1px solid var(--border); background: var(--panel-2);
  }
  .statusbar b { color: var(--text); font-weight: 500; }
  .legend { display: inline-flex; align-items: center; gap: 6px; }
  .legend .src { margin: 0; }

  @media (max-width: 720px) {
    .sym .n { display: none; }
    thead th, tbody td { padding: 8px 10px; }
    .news-ticker .events { font-size: 11px; }
  }

  /* ---------- News ticker ---------- */
  .news-ticker {
    position: sticky; top: 0; z-index: 50;
    height: 32px; background: #000;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; overflow: hidden;
  }
  .news-ticker .label {
    background: #ef5350; color: #fff;
    font-size: 11px; font-weight: 700;
    padding: 0 10px; height: 100%;
    display: flex; align-items: center;
    letter-spacing: .5px; white-space: nowrap; z-index: 1;
    flex-shrink: 0;
  }
  .news-ticker .label.alert { animation: label-flash 0.5s ease-in-out infinite; }
  .news-ticker .countdown {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    border-radius: 20px; padding: 2px 10px; height: 22px;
    display: flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; color: #f0b90b;
    white-space: nowrap; flex-shrink: 0; margin-left: 8px;
    font-variant-numeric: tabular-nums;
  }
  .news-ticker .countdown .cd-dot { width: 6px; height: 6px; border-radius: 50%; background: #f0b90b; flex-shrink: 0; animation: cd-pulse 1.5s ease-in-out infinite; }
  .news-ticker .countdown.urgent { color: #ef5350; border-color: rgba(239,83,80,.4); }
  .news-ticker .countdown.urgent .cd-dot { background: #ef5350; animation-duration: .4s; }
  .news-ticker .countdown.empty { opacity: 0; }
  @keyframes cd-pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .news-ticker .events {
    flex: 1; overflow: hidden; padding: 0 12px;
    display: flex; align-items: center;
  }
  .news-ticker .events-inner {
    display: inline-block; white-space: nowrap;
    color: #fff; font-size: 12px;
    animation: news-scroll 90s linear infinite;
    will-change: transform;
  }
  .news-ticker:hover .events-inner { animation-play-state: paused; }
  @keyframes news-scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  .news-ticker .events-inner .sep { color: #ef5350; margin: 0 18px; font-size: 8px; }
  .news-ticker .events-inner b { font-weight: 700; }
  .news-ticker.flash-5m { animation: flash-5m 0.8s ease-in-out infinite; }
  .news-ticker.flash-1m { animation: flash-1m 0.3s ease-in-out infinite; }
  @keyframes flash-5m { 0%,100%{background:#000} 50%{background:#fff} }
  @keyframes flash-1m { 0%,100%{background:#ef5350} 50%{background:#fff} }
  @keyframes label-flash { 0%,100%{background:#ef5350} 50%{background:#000} }

  /* ---------- News admin modal ---------- */
  .news-admin-btn {
    border: 1px solid var(--border); background: var(--panel);
    color: var(--muted); font-size: 12px; font-weight: 600;
    padding: 4px 10px; border-radius: 6px; cursor: pointer;
    white-space: nowrap;
  }
  .news-admin-btn:hover { color: var(--text); border-color: var(--accent); }
  .news-admin-btn.has-events { color: var(--accent); border-color: var(--accent); }

  .news-modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .news-modal-overlay.open { opacity: 1; pointer-events: auto; }
  .news-modal {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; width: 420px; max-width: 90vw; max-height: 80vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .news-modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    font-weight: 600; color: #fff; font-size: 14px;
  }
  .news-modal-header button { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; }
  .news-modal-header button:hover { color: var(--text); }
  .news-modal-body { padding: 16px 18px; overflow-y: auto; flex: 1; }
  .news-modal-body label {
    display: block; font-size: 11px; font-weight: 600;
    color: var(--muted); text-transform: uppercase; letter-spacing: .5px;
    margin-bottom: 4px; margin-top: 12px;
  }
  .news-modal-body label:first-child { margin-top: 0; }
  .news-modal-body input[type="text"],
  .news-modal-body input[type="datetime-local"] {
    width: 100%; height: 34px; border-radius: 6px;
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text); font-size: 13px; padding: 0 10px; outline: none;
  }
  .news-modal-body input:focus { border-color: var(--accent); }
  .news-add-btn {
    margin-top: 14px; width: 100%; height: 36px;
    border: 0; border-radius: 8px; cursor: pointer;
    background: var(--accent); color: #fff;
    font-size: 13px; font-weight: 600;
  }
  .news-add-btn:hover { opacity: .85; }
  .news-events-list { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
  .news-event-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px; border-radius: 6px; margin-bottom: 4px;
    background: var(--bg); border: 1px solid var(--border);
  }
  .news-event-item .ev-title { font-size: 13px; color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .news-event-item .ev-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; margin-left: 8px; }
  .news-event-item .ev-time { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .news-event-item .ev-del { background: none; border: none; color: var(--down); font-size: 14px; cursor: pointer; padding: 0 2px; }
  .news-event-item .ev-del:hover { opacity: .7; }
  .news-empty { color: var(--muted); font-size: 12px; text-align: center; padding: 16px 0; }
  .news-clear-btn {
    margin-top: 8px; width: 100%; height: 32px;
    border: 1px solid var(--down); border-radius: 6px; cursor: pointer;
    background: transparent; color: var(--down);
    font-size: 12px; font-weight: 600;
  }
  .news-clear-btn:hover { background: var(--down-bg); }
</style>
</head>
<body>

<div class="news-ticker" id="news-ticker">
  <span class="label" id="news-label">NEWS</span>
  <span class="countdown empty" id="news-countdown"><span class="cd-dot"></span><span id="cd-text"></span></span>
  <div class="events"><div class="events-inner" id="news-scroll-inner"></div></div>
</div>

<div class="topbar">
  <div class="brand"><span class="logo">D</span> Drift Screener</div>
  <span class="status connecting" id="status"><span class="dot"></span><span id="status-text">LOADING</span></span>
  <div class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="search" type="text" placeholder="Search symbol or name" autocomplete="off">
  </div>
  <div class="spacer"></div>
  <button class="news-admin-btn" id="news-admin-btn">News +</button>
  <div class="updated">Updated <b id="updated">—</b></div>
</div>

<div class="toolbar">
  <div class="tfgroup" id="tfgroup">
    <button class="tfbtn" data-tf="m1">1M</button>
    <button class="tfbtn" data-tf="m5">5M</button>
    <button class="tfbtn" data-tf="m15">15M</button>
    <button class="tfbtn" data-tf="m30">30M</button>
    <button class="tfbtn" data-tf="h1">1H</button>
    <button class="tfbtn" data-tf="h4">4H</button>
    <button class="tfbtn active" data-tf="h24">24H</button>
    <button class="tfbtn" data-tf="d3">3D</button>
    <button class="tfbtn" data-tf="w1">1W</button>
  </div>
  <div class="filters" id="filters">
    <button class="fbtn active" data-filter="all">All</button>
    <button class="fbtn gain" data-filter="gainers">Gainers</button>
    <button class="fbtn lose" data-filter="losers">Losers</button>
    <button class="fbtn fave" data-filter="faves">★ Faves</button>
  </div>
  <select id="chgfilter">
    <option value="0">Move: Any</option>
    <option value="1">&gt; 1%</option>
    <option value="3">&gt; 3%</option>
    <option value="5">&gt; 5%</option>
    <option value="10">&gt; 10%</option>
    <option value="20">&gt; 20%</option>
  </select>
  <select id="pricefilter">
    <option value="">Price: Any</option>
    <option value="lt.01">&lt; $0.01</option>
    <option value="lt.1">&lt; $0.10</option>
    <option value="lt1">&lt; $1</option>
    <option value="1_10">$1 – $10</option>
    <option value="10_100">$10 – $100</option>
    <option value="gt100">&gt; $100</option>
  </select>
  <select id="volfilter">
    <option value="0">Volume: Any</option>
    <option value="1000000">&gt; $1M</option>
    <option value="10000000">&gt; $10M</option>
    <option value="100000000">&gt; $100M</option>
    <option value="1000000000">&gt; $1B</option>
  </select>
  <select id="srcfilter">
    <option value="">Source: All</option>
    <option value="binance">Binance</option>
    <option value="coingecko">CoinGecko</option>
  </select>
</div>

<div class="wrap">
  <table id="table">
    <thead>
      <tr>
        <th data-col="symbol">Symbol</th>
        <th data-col="price">Price</th>
        <th data-col="chg">Chg % <span class="tflabel" id="tflabel">24H</span><span class="arr"></span></th>
        <th data-col="vol">Vol 24h</th>
        <th data-col="mcap">Mkt Cap</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">No coins match your filters.</div>
</div>

<div class="statusbar">
  <span>Showing <b id="count">0</b> of <b id="total">0</b> Drift Fund coins</span>
  <span class="legend"><span class="src binance"></span> Binance <span style="color:var(--muted)">(all windows)</span></span>
  <span class="legend"><span class="src coingecko"></span> CoinGecko <span style="color:var(--muted)">(1h/24h)</span></span>
  <span class="legend"><span class="star on" style="pointer-events:none">★</span> Favorites saved on this browser</span>
</div>

<div class="news-modal-overlay" id="news-modal-overlay">
  <div class="news-modal">
    <div class="news-modal-header">
      <span>Drift Fund News Events</span>
      <button id="news-modal-close">&times;</button>
    </div>
    <div class="news-modal-body">
      <label for="ev-title">Event Title</label>
      <input type="text" id="ev-title" placeholder="e.g. FOMC Statement">
      <label for="ev-time">Date &amp; Time (GMT+3)</label>
      <input type="datetime-local" id="ev-time">
      <button class="news-add-btn" id="news-add-btn">Add Event</button>
      <div class="news-events-list" id="news-events-list"></div>
      <button class="news-clear-btn" id="news-reset-btn" style="margin-top:6px;border-color:var(--accent);color:var(--accent)">Reset to Drift Fund Calendar</button>
    </div>
  </div>
</div>

<script>
// ===================== Symbol maps (generated) =====================
const BINANCE   = __BINANCE_JSON__;    // Drift symbol -> Binance pair
const CG_ONLY   = __CG_ONLY_JSON__;    // Drift symbol -> CoinGecko id (non-Binance)
const DF_TO_CG  = __DF_TO_CG_JSON__;   // Drift symbol -> CoinGecko id (all)

const PAIR_TO_DF = {};
for (const [df, pair] of Object.entries(BINANCE)) PAIR_TO_DF[pair] = df;
const ID_TO_DF = {};
for (const [df, id] of Object.entries(DF_TO_CG)) if (!(id in ID_TO_DF)) ID_TO_DF[id] = df;

const ALL = [...Object.keys(BINANCE), ...Object.keys(CG_ONLY)];

const TIMEFRAMES = [["m1","1M"],["m5","5M"],["m15","15M"],["m30","30M"],["h1","1H"],["h4","4H"],["h24","24H"],["d3","3D"],["w1","1W"]];
const FAST_WINDOWS = { m1:"1m", m5:"5m", m15:"15m", m30:"30m", h1:"1h", h4:"4h" };
const SLOW_WINDOWS = { d3:"3d", w1:"7d" };  // Binance rejects "1w"; 7d is the rolling week

// ===================== State =====================
const state = {};
for (const df of ALL) state[df] = { price:null, vol24:null, mcap:null, name:df, image:"", chgCG:{h1:null,h24:null}, src: BINANCE[df] ? "binance" : "coingecko" };
const live = {};      // pair -> { c, o, q }
const anchors = {};   // df -> { m1,m5,m15,m30,h1,h4 }

let activeTF = "h24";
let sortCol = "chg", sortAsc = false;
let filterMode = "all";
let minVol = 0, minChg = 0, priceRange = "", srcFilter = "";
const FAVS_KEY = "drift_faves";
let faves = new Set();
try { const a = JSON.parse(localStorage.getItem(FAVS_KEY) || "[]"); if (Array.isArray(a)) faves = new Set(a); } catch(e) {}
function saveFaves() { localStorage.setItem(FAVS_KEY, JSON.stringify([...faves])); }
function toggleFave(df) { if (!faves.delete(df)) faves.add(df); saveFaves(); render(); }
let ready = false, lastUpdate = 0;

const $ = id => document.getElementById(id);
const tbody = $("tbody"), emptyEl = $("empty"), tflabel = $("tflabel");

// ===================== Formatting =====================
function fmtUSD(v) {
  if (v == null || !isFinite(v)) return '<span class="dim">—</span>';
  const a = Math.abs(v);
  let s;
  if (a >= 1e9) s = (v/1e9).toFixed(2) + "B";
  else if (a >= 1e6) s = (v/1e6).toFixed(2) + "M";
  else if (a >= 1e3) s = (v/1e3).toFixed(2) + "K";
  else if (a >= 1) s = v.toFixed(2);
  else if (a >= 0.001) s = v.toFixed(4);
  else if (a >= 0.0001) s = v.toFixed(6);
  else s = v.toPrecision(4);
  return "$" + s;
}
function fmtPct(v) {
  if (v == null || !isFinite(v)) return '<span class="dim">—</span>';
  const cls = v > 0 ? "up" : v < 0 ? "down" : "dim";
  const big = Math.abs(v) >= 5 ? " big" : "";
  return `<span class="chg ${cls}${big}">${v > 0 ? "+" : ""}${v.toFixed(2)}%</span>`;
}

// ===================== Data model =====================
function computeRows() {
  const out = [];
  for (const df of ALL) {
    const s = state[df];
    const r = { symbol: df, name: s.name, image: s.image, mcap: s.mcap, src: s.src, price: null, vol: null, chg: null, chgAll: {} };
    if (s.src === "binance") {
      const L = live[BINANCE[df]] || {};
      const a = anchors[df] || {};
      const price = L.c ? parseFloat(L.c) : s.price;
      r.price = price;
      r.vol = L.q ? parseFloat(L.q) : s.vol24;
      for (const [key] of TIMEFRAMES) {
        if (key === "h24") r.chgAll.h24 = (L.o && L.c) ? (parseFloat(L.c)/parseFloat(L.o) - 1) * 100 : s.chgCG.h24;
        else r.chgAll[key] = (a[key] && price) ? (price / a[key] - 1) * 100 : null;
      }
    } else {
      r.price = s.price; r.vol = s.vol24;
      r.chgAll.h1 = s.chgCG.h1; r.chgAll.h24 = s.chgCG.h24;
    }
    r.chg = r.chgAll[activeTF];
    out.push(r);
  }
  return out;
}

// ===================== Render =====================
function render() {
  const rows = computeRows();
  const q = $("search").value.toLowerCase().trim();

  let list = rows.filter(r => {
    if (q && !r.symbol.toLowerCase().includes(q) && !(r.name || "").toLowerCase().includes(q)) return false;
    if (minVol && !(r.vol >= minVol)) return false;
    if (filterMode === "gainers" && !(r.chg > 0)) return false;
    if (filterMode === "losers" && !(r.chg < 0)) return false;
    if (filterMode === "faves" && !faves.has(r.symbol)) return false;
    if (minChg && !(r.chg != null && Math.abs(r.chg) >= minChg)) return false;
    if (srcFilter && r.src !== srcFilter) return false;
    if (priceRange) {
      const p = r.price;
      const ok = priceRange === "lt.01" ? p != null && p < 0.01
        : priceRange === "lt.1" ? p != null && p < 0.1
        : priceRange === "lt1" ? p != null && p < 1
        : priceRange === "1_10" ? p != null && p >= 1 && p < 10
        : priceRange === "10_100" ? p != null && p >= 10 && p < 100
        : p != null && p >= 100;
      if (!ok) return false;
    }
    return true;
  });

  const val = r => {
    if (sortCol === "symbol") return r.symbol;
    if (sortCol === "price") return r.price;
    if (sortCol === "vol") return r.vol;
    if (sortCol === "mcap") return r.mcap;
    return r.chg;
  };
  list.sort((a, b) => {
    const av = val(a), bv = val(b);
    if (sortCol === "symbol") return sortAsc ? String(av).localeCompare(bv) : String(bv).localeCompare(av);
    const an = (av == null || !isFinite(av)) ? -Infinity : av;
    const bn = (bv == null || !isFinite(bv)) ? -Infinity : bv;
    return sortAsc ? an - bn : bn - an;
  });

  $("count").textContent = list.length;
  $("total").textContent = rows.length;

  if (!list.length) { tbody.innerHTML = ""; emptyEl.style.display = "block"; return; }
  emptyEl.style.display = "none";

  tbody.innerHTML = list.map(r => {
    const ico = r.image ? `<img class="ico" src="${r.image}" loading="lazy" alt="">` : `<span class="ico"></span>`;
    const fav = faves.has(r.symbol);
    const star = `<button class="star${fav ? " on" : ""}" data-df="${r.symbol}" title="${fav ? "Remove from favorites" : "Add to favorites"}">${fav ? "★" : "☆"}</button>`;
    return `<tr>
      <td><div class="sym">${star}${ico}<span class="s">${r.symbol}</span><span class="src ${r.src}" title="${r.src === 'binance' ? 'Binance live' : 'CoinGecko'}"></span><span class="n">${r.name || ""}</span></div></td>
      <td class="num">${fmtUSD(r.price)}</td>
      <td class="num">${fmtPct(r.chg)}</td>
      <td class="num">${fmtUSD(r.vol)}</td>
      <td class="num dim">${fmtUSD(r.mcap)}</td>
    </tr>`;
  }).join("");
}

function setStatus(kind, text) { $("status").className = "status " + kind; $("status-text").textContent = text; }
function markUpdated() { lastUpdate = Date.now(); }

// ===================== REST: Binance =====================
async function seed24h() {
  const pairs = Object.values(BINANCE);
  for (let i = 0; i < pairs.length; i += 100) {
    try {
      const r = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbols=${encodeURIComponent(JSON.stringify(pairs.slice(i, i+150)))}`);
      if (!r.ok) continue;
      for (const t of await r.json()) {
        const L = live[t.symbol] || (live[t.symbol] = {});
        L.o = t.openPrice; L.q = t.quoteVolume; if (L.c == null) L.c = t.lastPrice;
      }
    } catch (e) {}
  }
}
async function seedWindows(winMap) {
  const pairs = Object.values(BINANCE);
  for (const [key, win] of Object.entries(winMap)) {
    for (let i = 0; i < pairs.length; i += 100) {
      let done = false;
      for (let attempt = 0; attempt < 2 && !done; attempt++) {
        try {
          const r = await fetch(`https://api.binance.com/api/v3/ticker?symbols=${encodeURIComponent(JSON.stringify(pairs.slice(i, i+100)))}&windowSize=${win}`);
          if (!r.ok) { await new Promise(x => setTimeout(x, 600)); continue; }
          for (const t of await r.json()) {
            const df = PAIR_TO_DF[t.symbol]; if (!df) continue;
            (anchors[df] = anchors[df] || {})[key] = parseFloat(t.openPrice);
          }
          done = true;
        } catch (e) { await new Promise(x => setTimeout(x, 600)); }
      }
      await new Promise(r => setTimeout(r, 120));
    }
  }
}

// ===================== REST: CoinGecko =====================
async function cgMarkets(ids) {
  const out = [];
  for (let i = 0; i < ids.length; i += 150) {
    try {
      const r = await fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${ids.slice(i, i+150).join(",")}&per_page=250&sparkline=false&price_change_percentage=1h,24h`);
      if (r.ok) out.push(...await r.json());
    } catch (e) {}
    await new Promise(r => setTimeout(r, 250));
  }
  return out;
}
async function seedCGOnly() {
  const ids = Object.values(CG_ONLY); if (!ids.length) return;
  for (const c of await cgMarkets(ids)) {
    const df = ID_TO_DF[c.id]; if (!df || !state[df]) continue;
    const s = state[df];
    s.price = c.current_price; s.vol24 = c.total_volume; s.mcap = c.market_cap;
    s.name = c.name; s.image = c.image || s.image;
    s.chgCG.h1 = c.price_change_percentage_1h_in_currency;
    s.chgCG.h24 = c.price_change_percentage_24h_in_currency;
  }
}
async function seedCGAll() {
  const ids = [...new Set(Object.values(DF_TO_CG))];
  for (const c of await cgMarkets(ids)) {
    const df = ID_TO_DF[c.id]; if (!df || !state[df]) continue;
    const s = state[df];
    s.mcap = c.market_cap; s.name = c.name; s.image = c.image || s.image;
    if (s.src === "coingecko" && s.price == null) s.price = c.current_price;
  }
}

// ===================== WebSocket =====================
const WS_URLS = ["wss://stream.binance.com:9443/ws/!miniTicker@arr", "wss://data-stream.binance.vision/ws/!miniTicker@arr"];
let ws, wsRetry = 0, wsIdx = 0;
function connectWS() {
  try { ws = new WebSocket(WS_URLS[wsIdx % WS_URLS.length]); }
  catch (e) { setStatus("offline", "OFFLINE"); setTimeout(connectWS, 5000); return; }
  ws.onopen = () => { wsRetry = 0; };
  ws.onmessage = ev => {
    lastUpdate = Date.now();
    if (ready) setStatus("live", "LIVE");
    let arr; try { arr = JSON.parse(ev.data); } catch (e) { return; }
    for (const d of arr) { const L = live[d.s] || (live[d.s] = {}); L.c = d.c; L.o = d.o; L.q = d.q; }
    scheduleRender();
  };
  ws.onclose = () => { setStatus("connecting", "RECONNECTING"); wsRetry++; wsIdx++; setTimeout(connectWS, Math.min(1000 * wsRetry, 10000)); };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
}

// ===================== Loop / events =====================

setInterval(() => {
  if (dirty && ready) { render(); dirty = false; }

}, 1000);

// ===================== News events =====================
const NEWS_KEY = "drift_news_events";
let newsEvents = [], alerted5m = new Set(), alerted1m = new Set(), audioCtx = null;

const DRIFTFUND_SEED = [
  {t:"US Core Retail Sales (MoM) (Aug)",       d:"2026-09-16T12:30:00Z"},
  {t:"US Retail Sales (MoM) (Aug)",             d:"2026-09-16T12:30:00Z"},
  {t:"US Crude Oil Inventories",                d:"2026-09-16T14:30:00Z"},

  {t:"US FOMC Statement",                       d:"2026-09-16T18:00:00Z"},
  {t:"US FOMC Press Conference",                d:"2026-09-16T18:30:00Z"},
  {t:"EU CPI (YoY) (Aug)",                      d:"2026-09-17T09:00:00Z"},

  {t:"US S&P Global Services PMI (Sep)",        d:"2026-09-23T13:45:00Z"},

];

function loadNewsEvents() {
  try { newsEvents = JSON.parse(localStorage.getItem(NEWS_KEY) || ""); } catch(e) { newsEvents = null; }
  if (!Array.isArray(newsEvents) || !newsEvents.length) {
    newsEvents = DRIFTFUND_SEED.filter(e => new Date(e.d).getTime() > Date.now() - 60000).map((e,i) => ({
      id: "df" + i, title: e.t, time: e.d
    }));
    saveNewsEvents();
  }
}
function saveNewsEvents() { localStorage.setItem(NEWS_KEY, JSON.stringify(newsEvents)); }
function addNewsEvent(title, timeISO) {
  newsEvents.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), title, time: timeISO });
  newsEvents.sort((a,b) => new Date(a.time) - new Date(b.time));
  saveNewsEvents(); renderNewsTicker(); renderNewsEventsList();
}
function deleteNewsEvent(id) {
  newsEvents = newsEvents.filter(e => e.id !== id);
  alerted5m.delete(id); alerted1m.delete(id);
  saveNewsEvents(); renderNewsTicker(); renderNewsEventsList();
}

function fmtGMT3(d) {
  return new Date(d.getTime() + 3*3600*1000).toISOString().slice(11,16) + " GMT+3";
}
function fmtGMT3Short(d) {
  return new Date(d.getTime() + 3*3600*1000).toISOString().slice(11,16);
}

function renderNewsTicker() {
  const now = Date.now();
  const upcoming = newsEvents.filter(e => new Date(e.time).getTime() > now - 60000);
  const el = $("news-scroll-inner");
  if (!upcoming.length) {
    el.innerHTML = '<span style="color:#787b86">No upcoming news events</span>';
    el.style.animation = "none";
    return;
  }
  const build = () => upcoming.map(e => {
    const t = new Date(e.time);
    const ts = fmtGMT3(t);
    const mins = Math.round((t.getTime() - now) / 60000);
    let urg = "";
    if (mins <= 0 && mins > -1) urg = ' <b style="color:#ef5350">NOW</b>';
    else if (mins <= 5 && mins > 0) urg = ` <b style="color:#f0b90b">${mins}m</b>`;
    return `<span>${e.title} &mdash; ${ts}${urg}</span><span class="sep">&#x25CF;</span>`;
  }).join("");
  el.innerHTML = build() + build();
  el.style.animation = "";
}

function renderCountdown() {
  const now = Date.now();
  const cd = $("news-countdown"), cdText = $("cd-text");
  let next = null;
  for (const e of newsEvents) {
    const t = new Date(e.time).getTime();
    if (t > now) { next = e; break; }
  }
  if (!next) { cd.classList.add("empty"); cd.classList.remove("urgent"); return; }
  const diff = new Date(next.time).getTime() - now;
  const sec = Math.floor(diff / 1000);
  const urgent = sec <= 300;
  cd.classList.remove("empty");
  cd.classList.toggle("urgent", urgent);
  if (sec <= 0) { cdText.textContent = next.title + " — NOW"; return; }
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  let str = "";
  if (h > 0) str = h + "h " + m + "m";
  else if (m > 0) str = m + "m " + s + "s";
  else str = s + "s";
  cdText.textContent = str;
}

function checkNewsAlerts() {
  const now = Date.now(), ticker = $("news-ticker"), label = $("news-label");
  let any5m = false, any1m = false;
  for (const ev of newsEvents) {
    const dt = new Date(ev.time).getTime() - now;
    if (dt > -30000 && dt <= 300000) {
      any5m = true;
      if (!alerted5m.has(ev.id)) {
        alerted5m.add(ev.id);
        showNotification("News in 5 min", ev.title + " — " + fmtGMT3Short(new Date(ev.time)));
        playAlertSound(440, 300);
      }
    }
    if (dt > -10000 && dt <= 60000) {
      any1m = true;
      if (!alerted1m.has(ev.id)) {
        alerted1m.add(ev.id);
        showNotification("NEWS IN 1 MINUTE", ev.title + " — GET READY");
        playAlertSound(880, 500);
      }
    }
  }
  ticker.classList.toggle("flash-5m", any5m && !any1m);
  ticker.classList.toggle("flash-1m", any1m);
  label.classList.toggle("alert", any5m || any1m);
}

function playAlertSound(freq, dur) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = freq; o.type = "square"; g.gain.value = 0.3;
    o.start(audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur / 1000);
    o.stop(audioCtx.currentTime + dur / 1000);
  } catch(e) {}
}

function requestNotificationPermission() {
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
}
function showNotification(title, body) {
  if ("Notification" in window && Notification.permission === "granted") {
    try { new Notification(title, {body}); } catch(e) {}
  }
}

// ===================== News admin panel =====================
function renderNewsEventsList() {
  const list = $("news-events-list");
  $("news-admin-btn").classList.toggle("has-events", newsEvents.length > 0);

  }).join("") + '<button class="news-clear-btn" id="news-clear-btn">Clear All</button>';
}

function closeNewsModal() { $("news-modal-overlay").classList.remove("open"); }

$("news-admin-btn").addEventListener("click", openNewsModal);
$("news-modal-close").addEventListener("click", closeNewsModal);
$("news-modal-overlay").addEventListener("click", e => { if (e.target === $("news-modal-overlay")) closeNewsModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeNewsModal(); });

$("news-add-btn").addEventListener("click", () => {
  const t = $("ev-title").value.trim(), time = $("ev-time").value;

$("news-events-list").addEventListener("click", e => {
  const del = e.target.closest(".ev-del");

  if (e.target.closest("#news-clear-btn")) {
    newsEvents = []; alerted5m.clear(); alerted1m.clear();

  }
});

$("news-reset-btn").addEventListener("click", () => {
  newsEvents = DRIFTFUND_SEED.filter(e => new Date(e.d).getTime() > Date.now() - 60000).map((e,i) => ({
    id: "df" + i, title: e.t, time: e.d
  }));
  alerted5m.clear(); alerted1m.clear();
  saveNewsEvents(); renderNewsTicker(); renderNewsEventsList();
});

// ===================== Init =====================
async function init() {
  setStatus("connecting", "LOADING");
  const tasks = [
    seed24h().then(() => seedWindows(FAST_WINDOWS)).then(() => seedWindows(SLOW_WINDOWS)).then(() => { if (ready) scheduleRender(); }),
    seedCGOnly().then(() => { if (ready) scheduleRender(); }),
    seedCGAll().then(() => { if (ready) scheduleRender(); })
  ];
  // show whatever we have as soon as the first data lands, and never hang
  await Promise.race([Promise.allSettled(tasks), new Promise(r => setTimeout(r, 6000))]);
  ready = true;
  setStatus("connecting", "CONNECTING");
  connectWS();
  render();

  setInterval(() => { seedWindows(FAST_WINDOWS).then(scheduleRender); }, 45000);
  setInterval(() => { seedWindows(SLOW_WINDOWS).then(scheduleRender); }, 300000);
  setInterval(() => { seed24h().then(scheduleRender); }, 60000);
  setInterval(() => { seedCGOnly().then(scheduleRender); }, 90000);
  setInterval(() => { seedCGAll().then(scheduleRender); }, 300000);
  setInterval(() => { if (Date.now() - lastUpdate > 15000) seed24h(); }, 5000);
}
init();

// ===================== Init news =====================
loadNewsEvents();
renderNewsTicker();
renderCountdown();
renderNewsEventsList();
setInterval(() => { renderNewsTicker(); renderCountdown(); checkNewsAlerts(); }, 1000);
